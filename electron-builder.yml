appId: com.mosaicbuilder.app
productName: Mosaic Builder
copyright: Copyright © 2026 Mosaic Builder contributors
asar: true
directories:
  output: release
  buildResources: build
files:
  - dist/renderer/**
  - dist-electron/**
  - package.json
  - "!**/{.DS_Store,Thumbs.db}"
  - "!**/*.{ts,tsx,map}"
  # vite's publicDir ("resources") copies test fixtures and a duplicate icon
  # set into dist/renderer; keep both out of the asar. Icons ship via
  # extraResources / the platform icon: fields, not from inside the app bundle.
  - "!dist/renderer/fixtures/**"
  - "!dist/renderer/icons/**"
extraResources:
  - from: resources/icons
    to: icons
mac:
  category: public.app-category.graphics-design
  icon: resources/icons/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
win:
  icon: resources/icons/icon.ico
  target:
    - target: nsis
      arch: [x64]
linux:
  icon: resources/icons/icon-512.png
  category: Graphics
  target:
    - target: AppImage
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  shortcutName: Mosaic Builder
  artifactName: Mosaic-Builder-Setup-${version}.${ext}
publish: null
